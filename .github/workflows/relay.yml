name: relay

on:
  push:
    branches: [main]
    paths: ['relay/**']
  pull_request:
    paths: ['relay/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - run: cd relay && ./gradlew build --stacktrace

      - run: docker build ./relay
