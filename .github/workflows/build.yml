name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The JetBrains Runtime, not just any JDK 25: Jewel's DecoratedWindow calls error() outright
      # when JBR.isAvailable() is false. Installing it here also saves Gradle provisioning it, which
      # is a ~350 MB download on a cold cache.
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Neither the live-adb nor the network tests run: no device, and no reason to hit Google.
      - run: ./gradlew build --stacktrace

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            task: packageDmg
            extension: dmg
            label: macos-arm64
          - os: ubuntu-latest
            task: packageDeb
            extension: deb
            label: linux-x64
          - os: windows-latest
            task: packageMsi
            extension: msi
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage shells out to WiX for an .msi and fails without it. WiX 3.11 rather than 4/5 because
      # it is the version jpackage has supported longest.
      - if: runner.os == 'Windows'
        run: choco install wixtoolset --version 3.11.2 --no-progress -y

      - run: ./gradlew ${{ matrix.task }} --stacktrace

      # The build succeeding says nothing about the image being runnable — see verifyDistributable.
      - run: ./gradlew :desktopApp:verifyDistributable

      - name: Name the artifact for the platform it was built on
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          found=$(find desktopApp/build/compose/binaries -maxdepth 3 -name "*.${{ matrix.extension }}" | head -1)
          test -n "$found" || { echo "no .${{ matrix.extension }} was produced"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          cp "$found" "release/HereKitty-${version}-${{ matrix.label }}.${{ matrix.extension }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The updater verifies what it downloads against this, so it ships with the release.
      - name: Checksum every artifact
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
