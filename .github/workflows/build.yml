name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['mobile/**', 'relay/**', 'docs/**']
  pull_request:
    paths-ignore: ['mobile/**', 'relay/**', 'docs/**']
  # So the whole pipeline can be exercised without cutting a real release. A dispatched run always
  # produces a draft.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp the artifacts with
        default: 0.0.0-test
      all_platforms:
        description: Also build Windows and Linux, which have never succeeded
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The JetBrains Runtime, not just any JDK 25: Jewel's DecoratedWindow calls error() outright
      # when JBR.isAvailable() is false. Installing it here also saves Gradle provisioning it, which
      # is a ~350 MB download on a cold cache.
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Neither the live-adb nor the network tests run: no device, and no reason to hit Google.
      - run: ./gradlew build --stacktrace

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Chosen rather than filtered: the matrix context is not available to a job-level `if`, so a
      # rehearsal picks a smaller matrix instead of skipping entries.
      # macOS alone by default: it is the only platform that has ever packaged successfully, and the
      # release job needs every entry, so including an unproven runner means no release at all rather
      # than a partial one. Windows and Linux are opt-in until they work.
      matrix:
        include: >-
          ${{ fromJSON(inputs.all_platforms && '[
            {"os":"macos-14","task":"packageDmg","extension":"dmg","label":"macos-arm64"},
            {"os":"ubuntu-latest","task":"packageDeb","extension":"deb","label":"linux-x64"},
            {"os":"windows-latest","task":"packageMsi","extension":"msi","label":"windows-x64"}
          ]' || '[
            {"os":"macos-14","task":"packageDmg","extension":"dmg","label":"macos-arm64"}
          ]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # jpackage shells out to WiX for an .msi and fails without it. WiX 3.11 rather than 4/5 because
      # it is the version jpackage has supported longest.
      - if: runner.os == 'Windows'
        run: choco install wixtoolset --version 3.11.2 --no-progress -y

      # The tag is the version. gradle.properties only supplies a default for local builds, so
      # without this the artifact would be named after the tag and report whatever was committed --
      # and the updater compares its own version against the tag, so a drift there means it either
      # never sees an update or always sees one.
      - shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          ./gradlew ${{ matrix.task }} -Pversion="$version" --stacktrace

      # The build succeeding says nothing about the image being runnable — see verifyDistributable.
      - run: ./gradlew :desktopApp:verifyDistributable

      - name: Name the artifact for the platform it was built on
        shell: bash
        env:
          # Empty on a tag push, where the tag itself is the version.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          found=$(find desktopApp/build/compose/binaries -maxdepth 3 -name "*.${{ matrix.extension }}" | head -1)
          test -n "$found" || { echo "no .${{ matrix.extension }} was produced"; exit 1; }
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          cp "$found" "release/HereKitty-${version}-${{ matrix.label }}.${{ matrix.extension }}"

      # The updater replaces the installed bundle, so it needs the bundle — not a disk image it would
      # have to mount, copy out of, and unmount. `ditto` rather than `zip` because it is the only one
      # that preserves an .app's symlinks and permission bits intact.
      - name: Archive the app bundle for the updater
        if: runner.os == 'macOS'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          ditto -c -k --sequesterRsrc --keepParent \
            desktopApp/build/compose/binaries/main/app/HereKitty.app \
            "release/HereKitty-${version}-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    # Publishing is the step worth a human. Add required reviewers to this environment in the
    # repository settings and a pushed tag will wait for approval before anything is published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The updater verifies what it downloads against this, so it ships with the release.
      - name: Checksum every artifact
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Pinned to a commit rather than a moving tag: this job holds `contents: write`, so a
      # repointed tag would be write access to publish artifacts under this repository's name.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # A rehearsal produces something unpublished: a run nobody tagged, or a tag carrying a
          # pre-release suffix. `ref_name` is a branch for a dispatched run and would match the
          # suffix test by accident, so that is checked only for tags.
          draft: >-
            ${{ github.event_name == 'workflow_dispatch'
            || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
